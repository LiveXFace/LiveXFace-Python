[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "serupa"
version = "0.1.0"
description = "Official Python SDK for Serupa — Face Recognition as a Service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["face-recognition", "biometrics", "api", "sdk", "serupa"]
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "responses>=0.25",
    "mypy>=1.9",
    "types-requests",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["serupa*"]

[tool.mypy]
python_version = "3.10"
strict = true
