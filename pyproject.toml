[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idemity"
version = "0.1.0"
description = "Official Python SDK for Idemity — Face Recognition as a Service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["face-recognition", "biometrics", "api", "sdk", "idemity"]
dependencies = [
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://idemity.com"
Repository = "https://github.com/idemity/idemity-python"
Issues = "https://github.com/idemity/idemity-python/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "responses>=0.25",
    "mypy>=1.9",
    "types-requests",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["idemity*"]

[tool.mypy]
python_version = "3.10"
strict = true
