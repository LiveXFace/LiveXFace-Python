[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "livexface"
version = "0.1.0"
description = "Official Python SDK for LiveXFace — Face Recognition as a Service"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["face-recognition", "biometrics", "api", "sdk", "livexface"]
dependencies = [
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://livexface.com"
Repository = "https://github.com/livexface/livexface-python"
Issues = "https://github.com/livexface/livexface-python/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "responses>=0.25",
    "mypy>=1.9",
    "types-requests",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["livexface*"]

[tool.mypy]
python_version = "3.10"
strict = true
